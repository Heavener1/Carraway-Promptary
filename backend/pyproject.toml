[project]
name = "promptary-api"
version = "0.1.0"
description = "Promptary backend API - prompt sharing community"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "pypinyin>=0.54.0",
    "alembic>=1.20.1",
    "httpx>=0.28.0",
    "cryptography>=45.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic generates these files; keep them out of style checks.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
